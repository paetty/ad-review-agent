name: Bug report
description: 报告可复现的问题（不要包含真实个人数据或密钥）
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据确认
      options:
        - label: 我确认内容中不包含密钥、个人信息或未授权广告数据。
          required: true
