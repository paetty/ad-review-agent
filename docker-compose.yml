services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: sqlite:////app/runtime/app.db
    ports:
      - "8000:8000"
    volumes:
      - ad_review_runtime:/app/runtime

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  ad_review_runtime:
